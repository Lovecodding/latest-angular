<div class="user-list-container">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search users</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Name, email, or username">
  </mat-form-field>

  <table mat-table [dataSource]="paginatedUsers" class="mat-elevation-z8">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user">{{ user.name }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef>Username</th>
      <td mat-cell *matCellDef="let user">{{ user.username }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let user">
        <a mat-button color="primary" [routerLink]="['/users/user-detail', user.id]">View</a>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="['name', 'email', 'username', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['name', 'email', 'username', 'actions'];"></tr>
  </table>

  <mat-paginator [length]="filteredUsers.length" [pageSize]="pageSize" [pageIndex]="page-1"
    (page)="setPage($event.pageIndex + 1)"></mat-paginator>
</div>
